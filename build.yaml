include:
  - board: nice_nano_v2
    shield: eyelash_sofle_central_dongle dongle_display raw_hid_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_G0N_BATT_RELAY=y -DCONFIG_G0N_HUD=y -DCONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n -DCONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096 -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10 -DCONFIG_USB_WORKQUEUE_STACK_SIZE=2048 -DCONFIG_USB_NRFX_WORK_QUEUE_STACK_SIZE=2048
    artifact-name: g0n_sofle_central_dongle
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_left
    cmake-args: -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y -DCONFIG_G0N_SCREEN_BATT=y -DCONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
    artifact-name: g0n_sofle_left
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_right
    cmake-args: -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y -DCONFIG_G0N_SCREEN_GLITCH=y -DCONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
    artifact-name: g0n_sofle_right
  - board: nice_nano_v2
    shield: settings_reset
